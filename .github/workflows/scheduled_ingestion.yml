name: UrbanPulse NEXUS — Scheduled Cloud Ingestion

on:
  schedule:
    # Hourly batch ingestion trigger at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run validation mode (0 API calls, 0 DB writes)'
        required: true
        type: boolean
        default: true
      force:
        description: 'Force execution (Bypass 45-minute recent batch cadence guard)'
        required: false
        type: boolean
        default: false

# Prevent overlapping or concurrent workflow executions
concurrency:
  group: urbanpulse-scheduled-ingestion
  cancel-in-progress: false

jobs:
  scheduled_batch_ingestion:
    name: Nagpur Scheduled Multi-Source Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deployment Activation Guard Check
        id: activation_check
        run: |
          # 1. If dry_run validation is requested, always allow execution (0 API calls, 0 DB writes)
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry-Run verification mode requested. Proceeding safely (0 external API calls, 0 DB writes)."
            echo "paused=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. For ANY live ingestion (whether scheduled cron or manual workflow_dispatch),
          # require explicit activation variable: ENABLE_CLOUD_INGESTION == 'true'
          if [ "${{ vars.ENABLE_CLOUD_INGESTION }}" != "true" ]; then
            echo "=========================================================================="
            echo "URBANPULSE CLOUD INGESTION: ACTIVATION GUARD IS PAUSED."
            echo "Live cloud ingestion is disabled because ENABLE_CLOUD_INGESTION != 'true'."
            echo "Event Trigger: ${{ github.event_name }}"
            echo "To enable live cloud ingestion, configure repository variable:"
            echo "  ENABLE_CLOUD_INGESTION = true"
            echo "under Settings -> Secrets and variables -> Actions -> Variables."
            echo "=========================================================================="
            echo "paused=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "paused=false" >> $GITHUB_OUTPUT

      - name: Execute Cloud Batch Ingestion
        if: steps.activation_check.outputs.paused != 'true'
        env:
          URBANPULSE_ENV: cloud
          PYTHONUNBUFFERED: "1"
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT || 4000 }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE || 'urbanpulse' }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          TOMTOM_MONTHLY_BUDGET: 16000
          TOMTOM_SAFETY_MARGIN: 500
          RAW_DATA_DIR: data/raw
          LOGS_DIR: logs
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "Running: python scripts/run_scheduled_batch.py $ARGS"
          python scripts/run_scheduled_batch.py $ARGS
